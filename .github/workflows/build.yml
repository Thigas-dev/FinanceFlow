name: Build

on:
  push:
  workflow_dispatch:

jobs:
  ios:
    name: iOS (.ipa sem assinatura)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Selecionar Xcode 16
        run: |
          XCODE=$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)
          echo "Usando $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Gerar projeto Xcode
        run: |
          brew install xcodegen
          chmod +x gradlew
          cd iosApp && xcodegen generate

      - name: Compilar app
        run: |
          xcodebuild \
            -project iosApp/FinanceFlow.xcodeproj \
            -scheme FinanceFlow \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Empacotar .ipa
        run: |
          mkdir -p Payload
          cp -R build/ios/Build/Products/Release-iphoneos/FinanceFlow.app Payload/
          zip -qr FinanceFlow-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: FinanceFlow-iOS
          path: FinanceFlow-unsigned.ipa

  android:
    name: Android (testes + APK)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Testes e APK
        run: |
          chmod +x gradlew
          ./gradlew :composeApp:testDebugUnitTest :composeApp:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: FinanceFlow-Android
          path: composeApp/build/outputs/apk/debug/*.apk
